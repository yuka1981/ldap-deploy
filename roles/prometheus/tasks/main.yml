---
# Prometheus 部署任務

- name: 包含防火牆設定
  ansible.builtin.include_tasks: firewall.yml
  when: prometheus_setup_firewall | default(true)

- name: 建立 Prometheus 群組
  ansible.builtin.group:
    name: '{{ prometheus_group }}'
    system: true
    state: present

- name: 建立 Prometheus 使用者
  ansible.builtin.user:
    name: '{{ prometheus_user }}'
    group: '{{ prometheus_group }}'
    system: true
    shell: /sbin/nologin
    home: '{{ prometheus_data_dir }}'
    create_home: false

- name: 建立 Prometheus 目錄
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ prometheus_user }}'
    group: '{{ prometheus_group }}'
    mode: '0755'
  loop:
    - '{{ prometheus_install_dir }}'
    - '{{ prometheus_data_dir }}'
    - '{{ prometheus_config_dir }}'

- name: 確保 Prometheus 配置目錄存在（用於 CA 憑證）
  ansible.builtin.file:
    path: '{{ prometheus_config_dir }}'
    state: directory
    owner: '{{ prometheus_user }}'
    group: '{{ prometheus_group }}'
    mode: '0755'
  when: node_exporter_enable_tls | default(true)

- name: 複製 CA 憑證到 Prometheus 配置目錄
  ansible.builtin.copy:
    src: '{{ node_exporter_ca_dir }}/ca.crt'
    dest: '{{ prometheus_tls_ca_cert }}'
    owner: '{{ prometheus_user }}'
    group: '{{ prometheus_group }}'
    mode: '0644'
    remote_src: true
  when: node_exporter_enable_tls | default(true)

- name: 包含 SELinux 設定
  ansible.builtin.include_tasks: selinux.yml

- name: 下載 Prometheus
  ansible.builtin.get_url:
    url: 'https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz'
    dest: /tmp/prometheus.tar.gz
    mode: '0644'

- name: 解壓縮 Prometheus
  ansible.builtin.unarchive:
    src: /tmp/prometheus.tar.gz
    dest: /opt/
    remote_src: true
    creates: /opt/prometheus-{{ prometheus_version }}.linux-amd64

- name: 複製 Prometheus 二進制檔案
  ansible.builtin.copy:
    src: /opt/prometheus-{{ prometheus_version }}.linux-amd64/prometheus
    dest: '{{ prometheus_install_dir }}/prometheus'
    owner: '{{ prometheus_user }}'
    group: '{{ prometheus_group }}'
    mode: '0755'
    remote_src: true
  notify: apply selinux context

- name: 複製 Prometheus 工具
  ansible.builtin.copy:
    src: /opt/prometheus-{{ prometheus_version }}.linux-amd64/promtool
    dest: '{{ prometheus_install_dir }}/promtool'
    owner: '{{ prometheus_user }}'
    group: '{{ prometheus_group }}'
    mode: '0755'
    remote_src: true

- name: 複製 Prometheus console 目錄
  ansible.builtin.copy:
    src: /opt/prometheus-{{ prometheus_version }}.linux-amd64/consoles
    dest: '{{ prometheus_install_dir }}/consoles'
    owner: '{{ prometheus_user }}'
    group: '{{ prometheus_group }}'
    mode: '0755'
    remote_src: true

- name: 複製 Prometheus console_libraries 目錄
  ansible.builtin.copy:
    src: /opt/prometheus-{{ prometheus_version }}.linux-amd64/console_libraries
    dest: '{{ prometheus_install_dir }}/console_libraries'
    owner: '{{ prometheus_user }}'
    group: '{{ prometheus_group }}'
    mode: '0755'
    remote_src: true

- name: 建立 Prometheus 配置文件
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: '{{ prometheus_config_dir }}/prometheus.yml'
    owner: '{{ prometheus_user }}'
    group: '{{ prometheus_group }}'
    mode: '0644'
  notify: restart prometheus

- name: 驗證 Prometheus 配置
  ansible.builtin.command:
    cmd: '{{ prometheus_install_dir }}/promtool check config {{ prometheus_config_dir }}/prometheus.yml'
  register: prometheus_config_check
  changed_when: false
  failed_when: prometheus_config_check.rc != 0

- name: 建立 Prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: '0644'
  notify: restart prometheus

- name: 重新載入 systemd（立即執行）
  ansible.builtin.systemd:
    daemon_reload: true

- name: 啟動並啟用 Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true

- name: 等待 Prometheus 就緒
  ansible.builtin.wait_for:
    port: '{{ prometheus_port }}'
    delay: 2
    timeout: 30

- name: 清理下載的檔案
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /tmp/prometheus.tar.gz
    - /opt/prometheus-{{ prometheus_version }}.linux-amd64

- name: 驗證 Prometheus 運作
  ansible.builtin.uri:
    url: 'http://localhost:{{ prometheus_port }}/api/v1/status/config'
    method: GET
    status_code: 200
  register: prometheus_status_check
  changed_when: false

- name: 顯示部署狀態
  ansible.builtin.debug:
    msg: 'Prometheus 已成功啟動 (http://{{ ansible_default_ipv4.address }}:{{ prometheus_port }})'

