---
- name: 建立備份目錄
  ansible.builtin.file:
    path: '{{ ldap_backup_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: 建立備份腳本目錄
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: '0755'

- name: 建立 LDAP 備份腳本
  ansible.builtin.template:
    src: backup_ldap.sh.j2
    dest: /usr/local/bin/backup_ldap.sh
    owner: root
    group: root
    mode: '0755'

- name: 建立備份清理腳本
  ansible.builtin.template:
    src: cleanup_backup.sh.j2
    dest: /usr/local/bin/cleanup_backup.sh
    owner: root
    group: root
    mode: '0755'

- name: 設定每日備份 cron job
  ansible.builtin.cron:
    name: 'LDAP Daily Backup'
    minute: '{{ ldap_backup_cron_minute }}'
    hour: '{{ ldap_backup_cron_hour }}'
    job: '/usr/local/bin/backup_ldap.sh'
    user: root

- name: 設定備份清理 cron job（每日執行）
  ansible.builtin.cron:
    name: 'LDAP Backup Cleanup'
    minute: '30'
    hour: '3'
    job: '/usr/local/bin/cleanup_backup.sh'
    user: root

- name: 測試備份腳本執行
  ansible.builtin.command: /usr/local/bin/backup_ldap.sh
  register: backup_test
  changed_when: backup_test.rc == 0

- name: 顯示備份測試結果
  ansible.builtin.debug:
    msg: '備份腳本測試完成，備份檔案位於 {{ ldap_backup_dir }}'
