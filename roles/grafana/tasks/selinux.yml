---
# Grafana SELinux 設定

- name: 檢查 SELinux 狀態
  ansible.builtin.command: getenforce
  register: selinux_enforce_status
  changed_when: false
  failed_when: false

- name: 確保 policycoreutils-python-utils 已安裝（用於 semanage）
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when: selinux_enforce_status.stdout == "Enforcing"

- name: 檢查 Grafana 目錄是否存在
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - '{{ grafana_install_dir }}'
    - '{{ grafana_data_dir }}'
    - '{{ grafana_log_dir }}'
    - '{{ grafana_config_dir }}'
    - '{{ grafana_provisioning_dir }}'
  register: grafana_dir_stat
  when: selinux_enforce_status.stdout == "Enforcing"

- name: 應用 Grafana 目錄的 SELinux context
  ansible.builtin.command: restorecon -R '{{ item.item }}'
  loop: '{{ grafana_dir_stat.results }}'
  when: 
    - selinux_enforce_status.stdout == "Enforcing"
    - item.stat.exists
  changed_when: false
  failed_when: false

- name: 設定 SELinux boolean 允許網路連線
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  when: selinux_enforce_status.stdout == "Enforcing"

- name: 檢查 Grafana port 是否已有 SELinux 標籤
  ansible.builtin.command: semanage port -l | grep -E "{{ grafana_port }}\s+tcp"
  register: grafana_port_check
  changed_when: false
  failed_when: false
  when:
    - selinux_enforce_status.stdout == "Enforcing"
    - grafana_port != 3000  # 3000 是 Grafana 預設 port，通常已有標籤

- name: 設定 Grafana port SELinux 標籤（如果使用非標準 port）
  ansible.builtin.command: >
    semanage port -a -t http_port_t -p tcp {{ grafana_port }}
  register: grafana_port_label
  changed_when: grafana_port_label.rc == 0
  failed_when:
    - grafana_port_label.rc != 0
    - "'已定義' not in grafana_port_label.stderr"
    - "'Already defined' not in grafana_port_label.stderr"
  when:
    - selinux_enforce_status.stdout == "Enforcing"
    - grafana_port != 3000
    - grafana_port_check.rc != 0

- name: 驗證 SELinux 設定
  ansible.builtin.command: getenforce
  register: selinux_final_status
  changed_when: false

- name: 顯示 SELinux 狀態
  ansible.builtin.debug:
    msg: "SELinux 狀態: {{ selinux_final_status.stdout }}"

