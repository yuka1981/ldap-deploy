---
# Node Exporter TLS 憑證管理
# 在 monitoring server 上生成 CA 和憑證
# 在目標 server 上生成對應的憑證

- name: 檢查是否為 monitoring server
  ansible.builtin.set_fact:
    monitoring_is_monitoring_server: '{{ inventory_hostname in groups["monitoring_servers"] }}'

- name: 建立 CA 目錄（僅在 monitoring server）
  ansible.builtin.file:
    path: '{{ node_exporter_ca_dir }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: monitoring_is_monitoring_server

- name: 生成 CA 私鑰（僅在 monitoring server）
  community.crypto.openssl_privatekey:
    path: '{{ node_exporter_ca_dir }}/ca.key'
    size: 4096
    type: RSA
    mode: '0600'
  when: monitoring_is_monitoring_server
  register: monitoring_ca_key

- name: 生成 CA 憑證簽名請求（CSR）
  community.crypto.openssl_csr:
    path: '{{ node_exporter_ca_dir }}/ca.csr'
    privatekey_path: '{{ node_exporter_ca_dir }}/ca.key'
    subject:
      C: TW
      ST: Taiwan
      L: Taoyuan
      O: QCT Monitoring
      CN: Node Exporter CA
    mode: '0644'
  when: monitoring_is_monitoring_server
  register: monitoring_ca_csr

- name: 生成 CA 憑證（僅在 monitoring server）
  community.crypto.x509_certificate:
    path: '{{ node_exporter_ca_dir }}/ca.crt'
    csr_path: '{{ node_exporter_ca_dir }}/ca.csr'
    privatekey_path: '{{ node_exporter_ca_dir }}/ca.key'
    provider: selfsigned
    selfsigned_not_after: '+3650d'  # 10 年有效期
    mode: '0644'
  when: monitoring_is_monitoring_server
  register: monitoring_ca_cert

- name: 複製 CA 憑證到配置目錄（僅在 monitoring server）
  ansible.builtin.copy:
    src: '{{ node_exporter_ca_dir }}/ca.crt'
    dest: '{{ node_exporter_ca_cert }}'
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  when: monitoring_is_monitoring_server

- name: 生成 node_exporter 私鑰
  community.crypto.openssl_privatekey:
    path: '{{ node_exporter_tls_key }}'
    size: 2048
    type: RSA
    mode: '0600'
    owner: '{{ node_exporter_user }}'
    group: '{{ node_exporter_group }}'
  register: monitoring_node_exporter_key

- name: 生成 node_exporter 憑證簽名請求（CSR）
  community.crypto.openssl_csr:
    path: '{{ node_exporter_config_dir }}/node_exporter.csr'
    privatekey_path: '{{ node_exporter_tls_key }}'
    subject:
      C: TW
      ST: Taiwan
      L: Taoyuan
      O: QCT Monitoring
      CN: '{{ inventory_hostname }}.{{ ipa_domain | default("local") }}'
    subject_alt_name:
      - 'DNS:{{ inventory_hostname }}'
      - 'DNS:{{ inventory_hostname }}.{{ ipa_domain | default("local") }}'
      - 'DNS:localhost'
      - 'IP:127.0.0.1'
      - 'IP:{{ ansible_default_ipv4.address }}'
    mode: '0644'
  register: monitoring_node_exporter_csr
  failed_when: monitoring_node_exporter_csr.failed

- name: 驗證 CSR 文件已生成
  ansible.builtin.stat:
    path: '{{ node_exporter_config_dir }}/node_exporter.csr'
  register: monitoring_csr_file
  failed_when: not monitoring_csr_file.stat.exists

- name: 生成 node_exporter 憑證（monitoring server 本身）
  community.crypto.x509_certificate:
    path: '{{ node_exporter_tls_cert }}'
    csr_path: '{{ node_exporter_config_dir }}/node_exporter.csr'
    provider: ownca
    ownca_path: '{{ node_exporter_ca_dir }}/ca.crt'
    ownca_privatekey_path: '{{ node_exporter_ca_dir }}/ca.key'
    ownca_not_after: '+365d'
    mode: '0644'
    owner: '{{ node_exporter_user }}'
    group: '{{ node_exporter_group }}'
  when: monitoring_is_monitoring_server
  register: monitoring_node_exporter_cert

- name: 將 CSR 從目標 server 下載到控制機
  ansible.builtin.fetch:
    src: '{{ node_exporter_config_dir }}/node_exporter.csr'
    dest: '/tmp/{{ inventory_hostname }}.csr'
    flat: true
  when: not monitoring_is_monitoring_server and monitoring_csr_file.stat.exists
  register: monitoring_download_csr
  failed_when: monitoring_download_csr.failed

- name: 檢查控制機上的 CSR 文件是否存在
  ansible.builtin.stat:
    path: '/tmp/{{ inventory_hostname }}.csr'
  delegate_to: localhost
  become: false
  when: not monitoring_is_monitoring_server
  register: monitoring_local_csr_file

- name: 將 CSR 從控制機上傳到 monitoring server
  ansible.builtin.copy:
    src: '/tmp/{{ inventory_hostname }}.csr'
    dest: '/tmp/{{ inventory_hostname }}.csr'
    mode: '0644'
  when: not monitoring_is_monitoring_server and monitoring_local_csr_file.stat.exists
  delegate_to: '{{ groups["monitoring_servers"][0] }}'
  register: monitoring_upload_csr

- name: 檢查 monitoring server 上的 CSR 文件是否存在
  ansible.builtin.stat:
    path: '/tmp/{{ inventory_hostname }}.csr'
  delegate_to: '{{ groups["monitoring_servers"][0] }}'
  when: not monitoring_is_monitoring_server
  register: monitoring_remote_csr_file

- name: 檢查 monitoring server 上的 CA 憑證是否存在
  ansible.builtin.stat:
    path: '{{ node_exporter_ca_dir }}/ca.crt'
  delegate_to: '{{ groups["monitoring_servers"][0] }}'
  when: not monitoring_is_monitoring_server
  register: monitoring_ca_cert_file

- name: 檢查 monitoring server 上的 CA 私鑰是否存在
  ansible.builtin.stat:
    path: '{{ node_exporter_ca_dir }}/ca.key'
  delegate_to: '{{ groups["monitoring_servers"][0] }}'
  when: not monitoring_is_monitoring_server
  register: monitoring_ca_key_file

- name: 在 monitoring server 上簽名目標 server 的 CSR
  community.crypto.x509_certificate:
    path: '/tmp/{{ inventory_hostname }}.crt'
    csr_path: '/tmp/{{ inventory_hostname }}.csr'
    provider: ownca
    ownca_path: '{{ node_exporter_ca_dir }}/ca.crt'
    ownca_privatekey_path: '{{ node_exporter_ca_dir }}/ca.key'
    ownca_not_after: '+365d'
    mode: '0644'
  when: >
    not monitoring_is_monitoring_server
    and monitoring_remote_csr_file.stat.exists
    and monitoring_ca_cert_file.stat.exists
    and monitoring_ca_key_file.stat.exists
  delegate_to: '{{ groups["monitoring_servers"][0] }}'
  register: monitoring_sign_csr

- name: 警告：CA 憑證尚未生成
  ansible.builtin.debug:
    msg: >
      CA 憑證尚未在 monitoring server 上生成。
      請先執行 monitoring_servers 的部署，或使用以下命令：
      ansible-playbook playbook.yml --limit monitoring_servers --tags monitoring
  when: >
    not monitoring_is_monitoring_server
    and monitoring_remote_csr_file.stat.exists
    and (not monitoring_ca_cert_file.stat.exists or not monitoring_ca_key_file.stat.exists)
  failed_when: true

- name: 從 monitoring server 下載簽名後的憑證到控制機
  ansible.builtin.fetch:
    src: '/tmp/{{ inventory_hostname }}.crt'
    dest: '/tmp/{{ inventory_hostname }}_signed.crt'
    flat: true
  when: not monitoring_is_monitoring_server
  delegate_to: '{{ groups["monitoring_servers"][0] }}'
  register: monitoring_fetch_cert

- name: 將簽名後的憑證從控制機上傳到目標 server
  ansible.builtin.copy:
    src: '/tmp/{{ inventory_hostname }}_signed.crt'
    dest: '{{ node_exporter_tls_cert }}'
    owner: '{{ node_exporter_user }}'
    group: '{{ node_exporter_group }}'
    mode: '0644'
  when: not monitoring_is_monitoring_server

- name: 從 monitoring server 獲取 CA 憑證（目標 server）
  ansible.builtin.fetch:
    src: '{{ node_exporter_ca_dir }}/ca.crt'
    dest: '/tmp/monitoring_ca.crt'
    flat: true
  when: not monitoring_is_monitoring_server
  delegate_to: '{{ groups["monitoring_servers"][0] }}'
  run_once: true
  register: monitoring_fetch_ca

- name: 複製 CA 憑證到目標 server
  ansible.builtin.copy:
    src: '/tmp/monitoring_ca.crt'
    dest: '{{ node_exporter_ca_cert }}'
    owner: root
    group: root
    mode: '0644'
  when: not monitoring_is_monitoring_server
  register: monitoring_copy_ca

- name: 清理臨時 CSR 文件（目標 server）
  ansible.builtin.file:
    path: '{{ node_exporter_config_dir }}/node_exporter.csr'
    state: absent
  when: not monitoring_is_monitoring_server
  failed_when: false

- name: 清理 CA CSR 文件（monitoring server）
  ansible.builtin.file:
    path: '{{ node_exporter_ca_dir }}/ca.csr'
    state: absent
  when: monitoring_is_monitoring_server
  failed_when: false

- name: 清理控制機上的臨時 CSR 文件
  ansible.builtin.file:
    path: '/tmp/{{ inventory_hostname }}.csr'
    state: absent
  delegate_to: localhost
  become: false
  when: not monitoring_is_monitoring_server
  failed_when: false

- name: 清理控制機上的臨時憑證文件
  ansible.builtin.file:
    path: '/tmp/{{ inventory_hostname }}_signed.crt'
    state: absent
  delegate_to: localhost
  become: false
  when: not monitoring_is_monitoring_server
  failed_when: false

- name: 清理控制機上的臨時 CA 憑證文件
  ansible.builtin.file:
    path: '/tmp/monitoring_ca.crt'
    state: absent
  delegate_to: localhost
  become: false
  when: not monitoring_is_monitoring_server
  run_once: true
  failed_when: false

- name: 清理 monitoring server 上的臨時 CSR 文件
  ansible.builtin.file:
    path: '/tmp/{{ item }}.csr'
    state: absent
  delegate_to: '{{ groups["monitoring_servers"][0] }}'
  when: monitoring_is_monitoring_server
  loop: '{{ groups["ldap_servers"] + groups["redmine_servers"] }}'
  failed_when: false

- name: 清理 monitoring server 上的臨時憑證文件
  ansible.builtin.file:
    path: '/tmp/{{ item }}.crt'
    state: absent
  delegate_to: '{{ groups["monitoring_servers"][0] }}'
  when: monitoring_is_monitoring_server
  loop: '{{ groups["ldap_servers"] + groups["redmine_servers"] }}'
  failed_when: false
