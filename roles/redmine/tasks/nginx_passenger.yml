---
# Nginx 和 Passenger 從源碼編譯安裝

- name: 檢查 Nginx 是否已安裝
  ansible.builtin.command: '{{ nginx_install_dir }}/sbin/nginx -v'
  register: nginx_version_check
  changed_when: false
  failed_when: false

- name: 安裝 Passenger gem
  ansible.builtin.command: '{{ ruby_install_dir }}/bin/gem install passenger --no-document'
  environment:
    PATH: '{{ ruby_install_dir }}/bin:{{ ansible_env.PATH }}'
  register: passenger_install
  changed_when: "'already installed' not in passenger_install.stdout"
  when: nginx_version_check.rc != 0

- name: 執行 Passenger Nginx 模組安裝程式
  ansible.builtin.command: '{{ ruby_install_dir }}/bin/passenger-install-nginx-module --auto --prefix={{ nginx_install_dir }} --languages ruby --auto-download'
  environment:
    PATH: '{{ ruby_install_dir }}/bin:{{ ansible_env.PATH }}'
  when: nginx_version_check.rc != 0
  async: 3600
  poll: 30
  register: passenger_nginx_install
  changed_when: "'already' not in passenger_nginx_install.stdout"
  notify: apply selinux context

- name: 建立 Nginx 配置目錄
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ nginx_config_dir }}'
    - '{{ nginx_config_dir }}/conf.d'
    - '{{ nginx_config_dir }}/ssl'  # SSL 憑證目錄
    - '{{ nginx_log_dir }}'
  when: nginx_version_check.rc != 0

- name: 建立 Nginx mime.types 文件
  ansible.builtin.template:
    src: mime.types.j2
    dest: '{{ nginx_config_dir }}/mime.types'
    owner: root
    group: root
    mode: '0644'
  when: nginx_version_check.rc != 0

- name: 建立 Nginx 主配置文件
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: '{{ nginx_config_dir }}/nginx.conf'
    owner: root
    group: root
    mode: '0644'
  when: nginx_version_check.rc != 0
  notify: reload nginx

- name: 建立 Nginx systemd service
  ansible.builtin.template:
    src: nginx.service.j2
    dest: /etc/systemd/system/nginx.service
    owner: root
    group: root
    mode: '0644'
  when: nginx_version_check.rc != 0
  notify:
    - reload systemd
    - restart nginx

- name: 重新載入 systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: nginx_version_check.rc != 0

- name: 驗證 Nginx 安裝
  ansible.builtin.command: '{{ nginx_install_dir }}/sbin/nginx -v'
  register: nginx_final_check
  changed_when: false

- name: 顯示 Nginx 版本
  ansible.builtin.debug:
    msg: "Nginx 版本: {{ nginx_final_check.stderr }}"

