---
# Ansible Inventory 配置
# 根據 PRD v1.7 文件建立

all:
  children:
    # LDAP 伺服器主機組
    # 部署 FreeIPA 服務（包含 system_setup, openldap, security, backup, monitoring roles）
    ldap_servers:
      hosts:
        # LDAP 伺服器
        ldap:
          ansible_host: 43.212.22.244
          # 個別主機的 SSH key 設定（可選，會覆蓋主機組設定）
          # ansible_ssh_private_key_file: ~/.ssh/ldap_key
      vars:
        ansible_user: rocky
        ansible_python_interpreter: /usr/bin/python3
        # SSH 私鑰文件路徑（可在此層級設定，或使用全局設定）
        # ansible_ssh_private_key_file: ~/.ssh/id_rsa
        # SSH 連接參數（可選）
        # ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    # Redmine 伺服器主機組
    # 部署 Redmine 專案管理系統（包含 system_setup, redmine roles）
    redmine_servers:
      hosts:
        # Redmine 伺服器
        redmine:
          ansible_host: 43.213.69.194
          # 個別主機的 SSH key 設定（可選，會覆蓋主機組設定）
          # ansible_ssh_private_key_file: ~/.ssh/redmine_key
      vars:
        ansible_user: rocky
        ansible_python_interpreter: /usr/bin/python3
        # SSH 私鑰文件路徑（可在此層級設定，或使用全局設定）
        # ansible_ssh_private_key_file: ~/.ssh/id_rsa
        # SSH 連接參數（可選）
        # ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    # 監控伺服器主機組
    # 部署 Prometheus 和 Grafana 監控服務（包含 system_setup, monitoring, prometheus, grafana roles）
    monitoring_servers:
      hosts:
        # 監控伺服器
        monitoring:
          ansible_host: 43.212.247.56
          # 個別主機的 SSH key 設定（可選，會覆蓋主機組設定）
          # ansible_ssh_private_key_file: ~/.ssh/monitoring_key
      vars:
        ansible_user: rocky
        ansible_python_interpreter: /usr/bin/python3
        # SSH 私鑰文件路徑（可在此層級設定，或使用全局設定）
        # ansible_ssh_private_key_file: ~/.ssh/id_rsa
        # SSH 連接參數（可選）
        # ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  vars:
    # SSH 連接設定（全局設定，所有主機組都會繼承）
    # 如果個別主機或主機組有設定，會覆蓋此設定
    ansible_ssh_private_key_file: ~/.ssh/personal/prometheus_udemy.pem
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_ssh_pipelining: true
    ansible_ssh_timeout: 30
    # 管理網段（用於 SSH 和防火牆規則）
    # 這些網段可以透過 SSH 連線並存取管理服務
    management_networks:
      - '172.31.16.0/20'

    # Redmine 主機 IP 列表（用於防火牆規則）
    # 這些主機可以連線到 LDAP 伺服器的 LDAPS 服務（port 636）
    redmine_hosts:
      - '172.31.29.60'

    # 監控主機 IP 列表（用於防火牆規則）
    # 這些主機可以連線到 LDAP 伺服器的 node_exporter（port 9100）
    # 注意：此變數用於 LDAP 伺服器的防火牆規則，允許監控主機抓取 metrics
    monitoring_hosts:
      - '172.31.28.88'
      - '172.31.29.60'
      - '172.31.31.7'
