---
all:
  children:
    ldap_servers:
      hosts:
        ldap-prod:
          ansible_host: 192.168.1.10
          environment: production
        ldap-test:
          ansible_host: 192.168.1.20
          environment: test
      vars:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3

  vars:
    # 管理網段（用於 SSH 和防火牆規則）
    management_networks:
      - "192.168.1.0/24"
      - "10.0.0.0/24"
    
    # Redmine / GitLab 主機 IP（用於防火牆規則）
    redmine_hosts:
      - "192.168.1.30"
      - "192.168.1.31"
    
    gitlab_hosts:
      - "192.168.1.40"
      - "192.168.1.41"
    
    # 監控主機 IP（Prometheus / Grafana）
    monitoring_hosts:
      - "192.168.1.50"

